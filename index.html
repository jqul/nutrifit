<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- PWA -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#3f7d4f" />

    <!-- iOS PWA -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="NutriFit" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" href="/icon-192.png" type="image/png" />

    <!-- Android -->
    <meta name="mobile-web-app-capable" content="yes" />

    <title>NutriFit — Software para nutricionistas | Gestiona clientes online</title>
    <meta name="description" content="Software para nutricionistas y dietistas: crea planes de dieta, haz seguimiento de peso, fotos y check-ins de cada cliente desde un panel propio, sin que el cliente instale nada." />
    <meta name="robots" content="index, follow" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <!-- Registrar Service Worker -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then(reg => console.log('[NutriFit] SW registrado:', reg.scope))
            .catch(err => console.warn('[NutriFit] SW error:', err))
        })
      }
    </script>
  </body>
</html>
